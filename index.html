<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】AI経営診断</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.jsライブラリの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        .checkbox-label { display: flex; align-items: center; margin-bottom: 0.75rem; cursor: pointer; transition: background-color 0.2s; padding: 8px; border-radius: 8px; }
        .checkbox-label:hover { background-color: #f0f9ff; }
        .checkbox-label input[type="checkbox"] { margin-right: 0.75rem; width: 1.25rem; height: 1.25rem; accent-color: #059669; }
        .result-box { border: 1px solid #e5e7eb; padding: 1.5rem; margin-top: 1.5rem; border-radius: 0.5rem; background-color: #f9fafb; }
        .ai-generated-content { background-color: white; padding: 1.5rem; border-radius: 0.375rem; border: 1px solid #d1d5db; }
        .error-message { background-color: #fff1f2; border: 1px solid #fecaca; color: #be123c; padding: 1rem; border-radius: 0.375rem; }
        .loading-spinner { border: 4px solid #f3f4f6; border-top: 4px solid #059669; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">
    <div class="bg-white shadow-xl rounded-lg p-6 sm:p-10 w-full max-w-3xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-emerald-700 mb-2">無料で今すぐ経営診断をする</h1>
            <h2 class="text-xl sm:text-2xl font-semibold text-gray-700 mb-4">あなたのビジネスの「伸びしろ」を見える化します</h2>
            <p class="text-gray-600">10の質問に答えるだけで、貴社の強みと課題をAIが分析。事業を次のステージへ進めるためのヒントを見つけましょう。</p>
        </header>
        <form id="consultantCheckForm">
            <div class="space-y-1 mb-8">
                <h3 class="text-lg font-semibold text-gray-700 mb-3">マーケティング＆セールス 現状チェックリスト</h3>
                <p class="text-sm text-gray-500 mb-4">（できている、達成できている項目にチェックを入れてください）</p>
                <label class="checkbox-label"><input type="checkbox" name="checkItem" data-category="acquisition">名刺交換をすると高い確率で提案の機会に繋げられている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem" data-category="sales">商品を提案した際、十分に高い確率で成約できている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem" data-category="sales">商品の魅力を効果的に伝えるための言葉を整理できている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem" data-category="ltv">客単価は十分高い、客単価が高くなる提案法を確立している</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem" data-category="ltv">リピーターになってもらうための販売方法が確立できている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem" data-category="ltv">お客様からの仕事の紹介が多い、口コミで売上が伸びている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem" data-category="acquisition">HPから多くの問い合わせが来ており、売上に繋がっている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem" data-category="acquisition">売上拡大のためにSNSやブログ、広告をうまく活用できている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem" data-category="sales">効果的なブランディングができ、高単価でも成約できている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem" data-category="acquisition">他社と業務提携することで効果的に売上が伸ばせている</label>
            </div>
            <button type="button" id="diagnosisButton" onclick="showDiagnosis()" class="w-full bg-emerald-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">AIによる経営診断を受ける</button>
        </form>
        <div id="resultArea" class="result-box hidden"></div>
    </div>
    <script>
        let radarChartInstance = null;

        async function callGemini(prompt) {
            const apiEndpoint = `${window.location.origin}/api/proxy`;
            try {
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                if (!response.ok) {
                    let errorMsg = `サーバーでエラーが発生 (ステータス: ${response.status})。`;
                    try { const errorData = await response.json(); errorMsg += `<br>詳細: ${errorData.error}`; } catch (e) { /* ignore */ }
                    throw new Error(errorMsg);
                }
                const result = await response.json();
                if (result.text) { return result.text; }
                throw new Error("APIから予期しない形式の応答がありました。");
            } catch (error) {
                console.error("callGemini内部でエラー:", error);
                throw error;
            }
        }

        function displayError(area, error, button, buttonText) {
             area.innerHTML = `<div class="error-message"><h4 class="font-bold mb-2">エラーが発生しました</h4><p>${error.message || '不明なエラーです。'}</p><p class="text-sm mt-4"><b>【確認してください】</b><br>Vercelプロジェクトの環境変数「GEMINI_API_KEY」は正しく設定されていますか？（設定変更後は再デプロイが必要です）</p></div>`;
            if (button) { button.disabled = false; button.textContent = buttonText; }
        }

        function createRadarChart(scores) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            if (radarChartInstance) {
                radarChartInstance.destroy();
            }
            radarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['新規顧客獲得', '営業・提案力', '顧客価値(LTV)'],
                    datasets: [{
                        label: '現在のビジネス戦闘力',
                        data: [scores.acquisition, scores.sales, scores.ltv],
                        backgroundColor: 'rgba(5, 150, 105, 0.2)',
                        borderColor: 'rgba(5, 150, 105, 1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(5, 150, 105, 1)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgba(5, 150, 105, 1)'
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(0, 0, 0, 0.1)' },
                            grid: { color: 'rgba(0, 0, 0, 0.1)' },
                            pointLabels: { font: { size: 14 } },
                            suggestedMin: 0,
                            suggestedMax: 5,
                            ticks: { stepSize: 1, backdropColor: 'transparent' }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        async function showDiagnosis() {
            const resultArea = document.getElementById('resultArea');
            const diagnosisButton = document.getElementById('diagnosisButton');
            const allItems = Array.from(document.querySelectorAll('input[name="checkItem"]'));
            
            const scores = { acquisition: 0, sales: 0, ltv: 0 };
            const categoryTotals = { acquisition: 4, sales: 3, ltv: 3 };

            allItems.forEach(item => {
                if (item.checked) {
                    scores[item.dataset.category]++;
                }
            });
            
            // スコアを5段階評価に変換
            const chartScores = {
                acquisition: Math.round((scores.acquisition / categoryTotals.acquisition) * 5),
                sales: Math.round((scores.sales / categoryTotals.sales) * 5),
                ltv: Math.round((scores.ltv / categoryTotals.ltv) * 5)
            };

            const checkedItems = allItems.filter(item => item.checked).map(item => item.parentElement.textContent.trim());
            const uncheckedItems = allItems.filter(item => !item.checked).map(item => item.parentElement.textContent.trim());
            
            const necessityPercentage = Math.round((uncheckedItems.length / allItems.length) * 100);

            resultArea.innerHTML = `<h3 class="text-xl font-semibold mb-3">✨ AIが貴社の状況を分析中...</h3><p class="text-gray-600 mb-4">貴社の強みと伸びしろに基づいた診断レポートを作成しています。</p><div class="loading-spinner"></div>`;
            resultArea.classList.remove('hidden');
            resultArea.scrollIntoView({ behavior: 'smooth' });
            diagnosisButton.disabled = true; diagnosisButton.textContent = '分析中...';
            
            try {
                const prompt = `
                あなたはトップ経営コンサルタントです。ある経営者が事業の自己診断を行いました。

                ### 診断スコア (5段階評価)
                - 新規顧客獲得: ${chartScores.acquisition} / 5
                - 営業・提案力: ${chartScores.sales} / 5
                - 顧客価値(LTV): ${chartScores.ltv} / 5

                ### 詳細
                - 達成できている強み: ${checkedItems.length > 0 ? checkedItems.join(', ') : 'なし'}
                - 今後の伸びしろ: ${uncheckedItems.join(', ')}

                このデータに基づき、プロフェッショナルかつ経営者に寄り添う形で、以下の構成でフィードバックを生成してください。

                **1. 全体分析:**
                まずレーダーチャートのスコアに言及し、「診断結果のチャートを見ると、貴社の強みは『${Object.keys(chartScores).reduce((a, b) => chartScores[a] > chartScores[b] ? a : b)}』にあり、一方で『${Object.keys(chartScores).reduce((a, b) => chartScores[a] < chartScores[b] ? a : b)}』には大きな成長の機会が眠っていることが分かります。」のように、強みと伸びしろを指摘してください。

                **2. 伸びしろ領域への具体的アドバイス:**
                「今後の伸びしろ」の項目の中から特に重要なものを2〜3個選び、それぞれに対して具体的で実行可能な最初の一歩をアドバイスしてください。

                **3. 専門家と解決する未来（課題解決のイメージ）:**
                「専門家との協業で、これらの課題はこう変わります」という見出しで、コンサルタントと協力することで、課題がどのように解決され、どのような理想の未来が待っているかを具体的にイメージさせてください。例えば、「Webサイトからの問い合わせがない」という課題に対し、「Webサイトを単なる会社案内から『24時間働く営業マン』へと変革します。ターゲット顧客の心に響くメッセージを設計し、具体的な数値目標（例：問い合わせ数3倍）を掲げた改善プランを実行します。これにより、あなたは営業活動に悩む時間を減らし、事業の未来を考える時間をもっと確保できるようになるでしょう。」のように、ビフォーアフターを鮮明に描いてください。

                最後に、無料相談への行動を力強く促してください。
                `;

                const aiMessage = await callGemini(prompt);
                const consultationLink = 'https://lin.ee/moSqXKt';

                resultArea.innerHTML = `
                    <h3 class="text-xl font-semibold mb-4 text-center">AIによる経営診断レポート</h3>
                    <div class="w-full max-w-md mx-auto mb-6"><canvas id="radarChart"></canvas></div>
                    <div class="text-center mb-8">
                        <p class="text-lg text-gray-600">専門家への相談推奨度</p>
                        <p class="text-5xl font-bold text-emerald-600">${necessityPercentage}%</p>
                    </div>
                    <div class="ai-generated-content whitespace-pre-wrap">${aiMessage.replace(/\n/g, '<br><br>')}</div>
                    <div class="text-center mt-8">
                        <a href="${consultationLink}" target="_blank" rel="noopener noreferrer" class="inline-block bg-emerald-600 text-white font-bold py-3 px-8 rounded-lg shadow-lg hover:bg-emerald-700 transition-all transform hover:scale-105">
                            AI診断結果について無料相談する
                        </a>
                    </div>
                `;
                createRadarChart(chartScores);
                diagnosisButton.disabled = false; diagnosisButton.textContent = '再度、経営診断を受ける';
            } catch (error) {
                displayError(resultArea, error, diagnosisButton, 'AIによる経営診断を受ける');
            }
        }
    </script>
</body>
</html>
