<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無料！AI経営診断</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        .checkbox-label { display: flex; align-items: center; margin-bottom: 0.75rem; cursor: pointer; transition: background-color 0.2s; padding: 8px; border-radius: 8px; }
        .checkbox-label:hover { background-color: #f0f9ff; }
        .checkbox-label input[type="checkbox"] { margin-right: 0.75rem; width: 1.25rem; height: 1.25rem; accent-color: #059669; /* Tailwind emerald-600 */ }
        .result-box { border: 1px solid #e5e7eb; padding: 1.5rem; margin-top: 1.5rem; border-radius: 0.5rem; background-color: #f9fafb; }
        .ai-generated-content { background-color: white; padding: 1rem; border-radius: 0.375rem; border: 1px solid #d1d5db; }
        .error-message { background-color: #fff1f2; border: 1px solid #fecaca; color: #be123c; padding: 1rem; border-radius: 0.375rem; }
        .loading-spinner { border: 4px solid #f3f4f6; border-top: 4px solid #059669; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">
    <div class="bg-white shadow-xl rounded-lg p-6 sm:p-10 w-full max-w-3xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-emerald-700 mb-2">事業成長のためのAI経営診断</h1>
            <h2 class="text-xl sm:text-2xl font-semibold text-gray-700 mb-4">あなたのビジネスの「現在地」と「伸びしろ」を見える化します</h2>
            <p class="text-gray-600">10の質問に答えるだけで、貴社の強みと課題をAIが分析。事業を次のステージへ進めるためのヒントを発見しましょう。</p>
        </header>
        <form id="consultantCheckForm">
            <div class="space-y-1 mb-8">
                <h3 class="text-lg font-semibold text-gray-700 mb-3">マーケティング＆セールス 現状チェックリスト</h3>
                <p class="text-sm text-gray-500 mb-4">（できている、達成できている項目にチェックを入れてください）</p>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">名刺交換をすると高い確率で提案の機会に繋げられている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">商品を提案した際、十分に高い確率で成約できている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">商品の魅力を効果的に伝えるための言葉を整理できている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">客単価は十分高い、客単価が高くなる提案法を確立している</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">リピーターになってもらうための販売方法が確立できている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">お客様からの仕事の紹介が多い、口コミで売上が伸びている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">HPから多くの問い合わせが来ており、売上に繋がっている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">売上拡大のためにSNSやブログ、広告をうまく活用できている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">効果的なブランディングができ、高単価でも成約できている</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">他社と業務提携することで効果的に売上が伸ばせている</label>
            </div>
            <button type="button" id="diagnosisButton" onclick="showDiagnosis()" class="w-full bg-emerald-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">AIによる経営診断を受ける</button>
        </form>
        <div id="resultArea" class="result-box hidden"></div>
    </div>
    <script>
        async function callGemini(prompt) {
            // ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
            // ★ 変更点：URLの手動書き換えを不要にし、自動で取得するように変更
            // ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
            const apiEndpoint = `${window.location.origin}/api/proxy`;
            try {
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                if (!response.ok) {
                    let errorMsg = `サーバーでエラーが発生 (ステータス: ${response.status})。`;
                    try { const errorData = await response.json(); errorMsg += `<br>詳細: ${errorData.error}`; } catch (e) { /* ignore */ }
                    throw new Error(errorMsg);
                }
                const result = await response.json();
                if (result.text) { return result.text; }
                throw new Error("APIから予期しない形式の応答がありました。");
            } catch (error) {
                console.error("callGemini内部でエラー:", error);
                throw error;
            }
        }

        function displayError(area, error, button, buttonText) {
             area.innerHTML = `<div class="error-message"><h4 class="font-bold mb-2">エラーが発生しました</h4><p>${error.message || '不明なエラーです。'}</p><p class="text-sm mt-4"><b>【確認してください】</b><br>Vercelプロジェクトの環境変数「GEMINI_API_KEY」は正しく設定されていますか？（設定変更後は再デプロイが必要です）</p></div>`;
            if (button) { button.disabled = false; button.textContent = buttonText; }
        }

        async function showDiagnosis() {
            const resultArea = document.getElementById('resultArea');
            const diagnosisButton = document.getElementById('diagnosisButton');
            const allItems = Array.from(document.querySelectorAll('input[name="checkItem"]'));
            const checkedItems = allItems.filter(item => item.checked).map(item => item.parentElement.textContent.trim());
            const uncheckedItems = allItems.filter(item => !item.checked).map(item => item.parentElement.textContent.trim());

            resultArea.innerHTML = '';
            resultArea.classList.remove('hidden');

            if (allItems.length === checkedItems.length) {
                 resultArea.innerHTML = `<h3 class="text-xl font-semibold mb-3">AIによる経営診断結果</h3><div class="ai-generated-content"><p>素晴らしい経営手腕です！チェックリストの全ての項目を達成できていますね。貴社のビジネスは非常に高いレベルで機能していると言えるでしょう。経営コンサルタントは、その盤石な基盤の上に、更なる事業拡大や新規事業展開など、次の非連続な成長を描くための壁打ち相手としてご活用いただけます。</p></div>`;
                 resultArea.scrollIntoView({ behavior: 'smooth' });
                 return;
            }
            
            resultArea.innerHTML = `<h3 class="text-xl font-semibold mb-3">✨ AIが貴社の状況を分析中...</h3><p class="text-gray-600 mb-4">貴社の強みと伸びしろに基づいた診断レポートを作成しています。</p><div class="loading-spinner"></div>`;
            resultArea.scrollIntoView({ behavior: 'smooth' });
            diagnosisButton.disabled = true; diagnosisButton.textContent = '分析中...';
            
            try {
                const prompt = `
                あなたは優秀な経営コンサルタントです。ある経営者が事業の自己診断を行いました。

                ### 達成できている強み (チェック済み項目)
                ${checkedItems.length > 0 ? checkedItems.map(item => `- ${item}`).join('\n') : 'なし'}

                ### 今後の伸びしろ (未チェック項目)
                ${uncheckedItems.map(item => `- ${item}`).join('\n')}

                この結果に基づき、以下の構成で経営者へのフィードバックメッセージを生成してください。

                1.  **強みの称賛**: まず、達成できている項目を具体的に取り上げ、「素晴らしいですね」「見事です」といった言葉で経営者の手腕を称賛します。（1〜2文）
                2.  **課題の指摘と機会の提示**: 次に、未チェックの項目（伸びしろ）が、今後の事業成長における「絶好の機会」であることを伝えます。「もしこれらの課題を解決できれば、売上はさらに大きく飛躍するでしょう」といった形で、ポジティブな視点を提供します。（1〜2文）
                3.  **具体的な解決策の示唆と行動喚起**: 最後に、これらの課題解決には専門的な視点や第三者の客観的な意見が有効であることを示唆し、「一度、専門家と話してみませんか？」と無料経営相談に繋げてください。（1〜2文）

                全体を通して、相手を尊重し、未来への期待感を抱かせるような、プロフェッショナルかつ力強いトーンで記述してください。
                `;
                const aiMessage = await callGemini(prompt);
                const consultationLink = 'https://lin.ee/moSqXKt'; // ここを実際のLINEやフォームのURLに変更

                resultArea.innerHTML = `
                    <h3 class="text-xl font-semibold mb-3">AIによる経営診断レポート</h3>
                    <div class="ai-generated-content mb-6 whitespace-pre-wrap">${aiMessage.replace(/\n/g, '<br><br>')}</div>
                    <div class="text-center">
                        <a href="${consultationLink}" target="_blank" rel="noopener noreferrer" class="inline-block bg-emerald-600 text-white font-bold py-3 px-8 rounded-lg shadow-lg hover:bg-emerald-700 transition-all transform hover:scale-105">
                            AI診断結果について無料相談する
                        </a>
                    </div>
                `;
                diagnosisButton.disabled = false; diagnosisButton.textContent = '再度、経営診断を受ける';
            } catch (error) {
                displayError(resultArea, error, diagnosisButton, 'AIによる経営診断を受ける');
            }
        }
    </script>
</body>
</html>
